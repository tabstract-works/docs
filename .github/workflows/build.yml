name: Build SATySFi Documents

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build PDFs and index using Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace amutake/satysfi:latest \
            sh -c "cd /workspace/projects && mkdir -p /workspace/public && \
                  find . -name '*.saty' | while read file; do \
                    base=\$(basename \"\$file\" .saty); \
                    satysfi \"\$file\" -o \"/workspace/public/\$base.pdf\";
                  done"

      - name: Copy website sources
        run: cd /workspace/src && cp ./* /workspace/public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
